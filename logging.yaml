---
handlers:
  - sink: ext://sys.stderr
    modes: [headless]
    format: "{time:YYYY-MM-DD HH:mm:ss} | <level>{level:<8}</level> | {message}"
    level: INFO
    colorize: true

  - sink: app.log
    modes: [tui, headless]
    format: "{time:YYYY-MM-DD HH:mm:ss} | {level:<8} | {function:<15} | {line:<3} | {message}"
    level: INFO
    rotation: 2048000
    retention: 3
    backtrace: false
    diagnose: false
